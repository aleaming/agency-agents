<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Agency — AI Specialist Agent Selector</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --bg-card: #1a1d27;
  --bg-card-hover: #222633;
  --bg-surface: #151821;
  --bg-input: #1e2130;
  --border: #2a2e3d;
  --border-focus: #5b6abf;
  --text: #e4e6ef;
  --text-dim: #8b8fa5;
  --text-bright: #ffffff;
  --accent: #7c8cf5;
  --accent-dim: rgba(124, 140, 245, 0.12);
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,0.25);
  --transition: 180ms ease;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* Header */
.header {
  padding: 2.5rem 2rem 1.5rem;
  text-align: center;
  border-bottom: 1px solid var(--border);
  background: var(--bg-surface);
}
.header h1 {
  font-size: 1.75rem;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: -0.02em;
}
.header h1 span { color: var(--accent); }
.header p {
  margin-top: 0.5rem;
  color: var(--text-dim);
  font-size: 0.95rem;
  max-width: 540px;
  margin-left: auto;
  margin-right: auto;
}
.header-stats {
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  margin-top: 1rem;
  font-size: 0.82rem;
  color: var(--text-dim);
}
.header-stats strong { color: var(--text); }

/* Layout */
.app {
  display: flex;
  min-height: calc(100vh - 140px);
}

/* Sidebar */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: var(--bg-surface);
  padding: 1rem 0;
  position: sticky;
  top: 0;
  height: calc(100vh - 140px);
  overflow-y: auto;
}
.sidebar-label {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  padding: 0.5rem 1.25rem;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.55rem 1.25rem;
  cursor: pointer;
  font-size: 0.88rem;
  color: var(--text-dim);
  border-left: 3px solid transparent;
  transition: all var(--transition);
  user-select: none;
}
.sidebar-item:hover {
  background: var(--accent-dim);
  color: var(--text);
}
.sidebar-item.active {
  background: var(--accent-dim);
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 500;
}
.sidebar-item .count {
  margin-left: auto;
  background: var(--bg-card);
  border-radius: 100px;
  padding: 0.1rem 0.55rem;
  font-size: 0.72rem;
  font-weight: 600;
}

/* Main content */
.main {
  flex: 1;
  padding: 1.5rem 2rem 3rem;
  min-width: 0;
}

/* Search */
.search-bar {
  position: relative;
  max-width: 420px;
  margin-bottom: 1.5rem;
}
.search-bar svg {
  position: absolute;
  left: 0.85rem;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--text-dim);
  pointer-events: none;
}
.search-bar input {
  width: 100%;
  padding: 0.6rem 0.85rem 0.6rem 2.5rem;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 0.88rem;
  outline: none;
  transition: border-color var(--transition);
}
.search-bar input::placeholder { color: var(--text-dim); }
.search-bar input:focus { border-color: var(--border-focus); }

/* Results heading */
.results-heading {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 1rem;
  font-weight: 500;
}

/* Agent grid */
.agent-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
}

/* Agent card */
.agent-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.agent-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--card-color, var(--accent));
  opacity: 0;
  transition: opacity var(--transition);
}
.agent-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--card-color, var(--accent));
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}
.agent-card:hover::before { opacity: 1; }

.card-top {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
}
.card-emoji {
  font-size: 1.6rem;
  line-height: 1;
  flex-shrink: 0;
}
.card-info { min-width: 0; }
.card-name {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-bright);
  line-height: 1.3;
}
.card-division {
  font-size: 0.72rem;
  color: var(--text-dim);
  margin-top: 0.15rem;
}
.card-desc {
  font-size: 0.82rem;
  color: var(--text-dim);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-top: 0.75rem;
}
.card-tag {
  font-size: 0.7rem;
  padding: 0.15rem 0.5rem;
  border-radius: 100px;
  background: var(--accent-dim);
  color: var(--accent);
  font-weight: 500;
  white-space: nowrap;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-dim);
}
.empty-state .emoji { font-size: 2.5rem; margin-bottom: 0.75rem; }
.empty-state p { font-size: 0.95rem; }

/* Detail panel (modal) */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  backdrop-filter: blur(4px);
}
.overlay.open { display: block; }

.detail-panel {
  display: none;
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(560px, 90vw);
  background: var(--bg-surface);
  border-left: 1px solid var(--border);
  z-index: 101;
  overflow-y: auto;
  box-shadow: -8px 0 30px rgba(0,0,0,0.4);
  transform: translateX(20px);
  opacity: 0;
  transition: transform 220ms ease, opacity 220ms ease;
}
.detail-panel.open {
  display: block;
  transform: translateX(0);
  opacity: 1;
}

.detail-header {
  padding: 1.5rem 1.75rem;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.detail-header::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--card-color, var(--accent));
}
.detail-close {
  position: absolute;
  top: 1.25rem;
  right: 1.25rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-dim);
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1.1rem;
  transition: all var(--transition);
}
.detail-close:hover { color: var(--text); border-color: var(--text-dim); }
.detail-emoji { font-size: 2.5rem; margin-bottom: 0.5rem; }
.detail-name {
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--text-bright);
}
.detail-division-tag {
  display: inline-block;
  margin-top: 0.4rem;
  font-size: 0.75rem;
  padding: 0.2rem 0.65rem;
  border-radius: 100px;
  background: var(--accent-dim);
  color: var(--accent);
  font-weight: 500;
}

.detail-body { padding: 1.5rem 1.75rem 2.5rem; }

.detail-section {
  margin-bottom: 1.5rem;
}
.detail-section-title {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 0.5rem;
}
.detail-description {
  font-size: 0.9rem;
  line-height: 1.65;
  color: var(--text);
}
.detail-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
.detail-meta-item label {
  display: block;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-bottom: 0.25rem;
  font-weight: 600;
}
.detail-meta-item span {
  font-size: 0.88rem;
  color: var(--text);
}
.detail-missions {
  list-style: none;
  padding: 0;
}
.detail-missions li {
  position: relative;
  padding: 0.4rem 0 0.4rem 1.2rem;
  font-size: 0.88rem;
  color: var(--text);
}
.detail-missions li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.75rem;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--card-color, var(--accent));
}
.detail-file-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 1rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--accent);
  font-size: 0.82rem;
  font-weight: 500;
  text-decoration: none;
  transition: all var(--transition);
}
.detail-file-link:hover {
  border-color: var(--accent);
  background: var(--accent-dim);
}

/* Color swatch in detail */
.detail-color-swatch {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 4px;
  vertical-align: middle;
  margin-right: 0.3rem;
  border: 1px solid rgba(255,255,255,0.1);
}

/* Mobile */
@media (max-width: 768px) {
  .sidebar {
    display: none;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 50;
    width: 260px;
    height: 100vh;
    box-shadow: 4px 0 20px rgba(0,0,0,0.4);
  }
  .sidebar.mobile-open { display: block; }
  .mobile-toggle {
    display: flex !important;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
    margin-bottom: 1rem;
  }
  .main { padding: 1rem 1rem 3rem; }
  .agent-grid { grid-template-columns: 1fr; }
  .detail-panel { width: 100vw; }
}
.mobile-toggle { display: none; }

/* Keyboard hint */
.kbd {
  display: inline-block;
  padding: 0.1rem 0.35rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 0.7rem;
  font-family: inherit;
  color: var(--text-dim);
  margin-left: 0.35rem;
}
</style>
</head>
<body>

<div class="header">
  <h1>🎭 The <span>Agency</span></h1>
  <p>Browse and select from 51 specialized AI agent personalities. Find the right expert for your project.</p>
  <div class="header-stats">
    <span><strong id="agent-count">51</strong> agents</span>
    <span><strong>9</strong> divisions</span>
    <span>MIT licensed</span>
  </div>
</div>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-label">Divisions</div>
    <div class="sidebar-item active" data-division="all">
      <span>📋</span>
      <span>All Agents</span>
      <span class="count" id="all-count">51</span>
    </div>
    <div id="division-list"></div>
  </nav>

  <main class="main">
    <button class="mobile-toggle" id="mobile-toggle">
      <span>☰</span> Filter by Division
    </button>

    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Search agents by name, role, or description…" autocomplete="off">
    </div>

    <div class="results-heading" id="results-heading">Showing all 51 agents</div>
    <div class="agent-grid" id="agent-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="emoji">🔍</div>
      <p>No agents match your search. Try a different term.</p>
    </div>
  </main>
</div>

<!-- Detail panel -->
<div class="overlay" id="overlay"></div>
<div class="detail-panel" id="detail-panel">
  <div class="detail-header" id="detail-header">
    <button class="detail-close" id="detail-close">&times;</button>
    <div class="detail-emoji" id="detail-emoji"></div>
    <div class="detail-name" id="detail-name"></div>
    <div class="detail-division-tag" id="detail-division-tag"></div>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<script>
(function () {
  let DATA = null;
  let activeDivision = "all";
  let searchQuery = "";

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  // Load data
  fetch("agents.json")
    .then((r) => r.json())
    .then((data) => {
      DATA = data;
      init();
    })
    .catch((err) => {
      console.error("Failed to load agents.json:", err);
      $("#agent-grid").innerHTML = '<div class="empty-state"><div class="emoji">⚠️</div><p>Failed to load agent data. Run <code>python3 tools/build-agents-json.py</code> first.</p></div>';
    });

  function init() {
    renderDivisions();
    renderAgents();
    bindEvents();
  }

  function renderDivisions() {
    const container = $("#division-list");
    container.innerHTML = DATA.divisions
      .map(
        (d) =>
          `<div class="sidebar-item" data-division="${d.id}">
            <span>${d.emoji}</span>
            <span>${d.label}</span>
            <span class="count">${d.count}</span>
          </div>`
      )
      .join("");
    $("#all-count").textContent = DATA.agents.length;
    $("#agent-count").textContent = DATA.agents.length;
  }

  function getFilteredAgents() {
    let agents = DATA.agents;
    if (activeDivision !== "all") {
      agents = agents.filter((a) => a.division === activeDivision);
    }
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      agents = agents.filter(
        (a) =>
          a.name.toLowerCase().includes(q) ||
          a.description.toLowerCase().includes(q) ||
          (a.role && a.role.toLowerCase().includes(q)) ||
          (a.personality && a.personality.toLowerCase().includes(q)) ||
          a.missions.some((m) => m.toLowerCase().includes(q))
      );
    }
    return agents;
  }

  function renderAgents() {
    const agents = getFilteredAgents();
    const grid = $("#agent-grid");
    const empty = $("#empty-state");
    const heading = $("#results-heading");

    if (agents.length === 0) {
      grid.innerHTML = "";
      empty.style.display = "block";
      heading.textContent = "No results";
      return;
    }

    empty.style.display = "none";
    const divLabel =
      activeDivision === "all"
        ? "all"
        : DATA.divisions.find((d) => d.id === activeDivision)?.label || activeDivision;
    heading.textContent = searchQuery
      ? `${agents.length} result${agents.length !== 1 ? "s" : ""} for "${searchQuery}"`
      : `Showing ${activeDivision === "all" ? "all " : ""}${agents.length} agent${agents.length !== 1 ? "s" : ""}${activeDivision !== "all" ? " in " + divLabel : ""}`;

    grid.innerHTML = agents
      .map(
        (a) =>
          `<div class="agent-card" data-id="${a.id}" style="--card-color: ${a.color}">
            <div class="card-top">
              <div class="card-emoji">${a.emoji}</div>
              <div class="card-info">
                <div class="card-name">${a.name}</div>
                <div class="card-division">${getDivisionLabel(a.division)}</div>
              </div>
            </div>
            <div class="card-desc">${a.description || ""}</div>
            ${a.missions.length ? `<div class="card-tags">${a.missions.slice(0, 3).map((m) => `<span class="card-tag">${m}</span>`).join("")}</div>` : ""}
          </div>`
      )
      .join("");
  }

  function getDivisionLabel(divId) {
    const d = DATA.divisions.find((d) => d.id === divId);
    return d ? `${d.emoji} ${d.label}` : divId;
  }

  function openDetail(agentId) {
    const agent = DATA.agents.find((a) => a.id === agentId);
    if (!agent) return;

    const header = $("#detail-header");
    header.style.setProperty("--card-color", agent.color);
    $("#detail-emoji").textContent = agent.emoji;
    $("#detail-name").textContent = agent.name;
    $("#detail-division-tag").textContent = getDivisionLabel(agent.division);

    let bodyHTML = "";

    if (agent.description) {
      bodyHTML += `
        <div class="detail-section">
          <div class="detail-section-title">Description</div>
          <div class="detail-description">${agent.description}</div>
        </div>`;
    }

    const hasMeta = agent.role || agent.personality;
    if (hasMeta) {
      bodyHTML += `<div class="detail-section"><div class="detail-section-title">Profile</div><div class="detail-meta-grid">`;
      if (agent.role) bodyHTML += `<div class="detail-meta-item"><label>Role</label><span>${agent.role}</span></div>`;
      if (agent.personality) bodyHTML += `<div class="detail-meta-item"><label>Personality</label><span>${agent.personality}</span></div>`;
      bodyHTML += `</div></div>`;
    }

    if (agent.missions.length) {
      bodyHTML += `
        <div class="detail-section">
          <div class="detail-section-title">Core Missions</div>
          <ul class="detail-missions" style="--card-color: ${agent.color}">
            ${agent.missions.map((m) => `<li>${m}</li>`).join("")}
          </ul>
        </div>`;
    }

    bodyHTML += `
      <div class="detail-section">
        <div class="detail-section-title">Details</div>
        <div class="detail-meta-grid">
          <div class="detail-meta-item">
            <label>Agent Color</label>
            <span><span class="detail-color-swatch" style="background:${agent.color}"></span>${agent.color}</span>
          </div>
          <div class="detail-meta-item">
            <label>Source File</label>
            <span style="font-family:monospace;font-size:0.8rem;">${agent.file}</span>
          </div>
        </div>
      </div>`;

    bodyHTML += `
      <div class="detail-section">
        <a class="detail-file-link" href="https://github.com/msitarzewski/agency-agents/blob/main/${agent.file}" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View full agent file on GitHub
        </a>
      </div>`;

    $("#detail-body").innerHTML = bodyHTML;
    $("#overlay").classList.add("open");
    // Small delay for animation
    requestAnimationFrame(() => {
      $("#detail-panel").classList.add("open");
    });
    document.body.style.overflow = "hidden";
  }

  function closeDetail() {
    $("#detail-panel").classList.remove("open");
    $("#overlay").classList.remove("open");
    document.body.style.overflow = "";
  }

  function bindEvents() {
    // Division sidebar
    document.addEventListener("click", (e) => {
      const item = e.target.closest(".sidebar-item");
      if (item) {
        activeDivision = item.dataset.division;
        $$(".sidebar-item").forEach((el) => el.classList.remove("active"));
        item.classList.add("active");
        renderAgents();
        // Close mobile sidebar
        $("#sidebar").classList.remove("mobile-open");
      }
    });

    // Agent card click
    document.addEventListener("click", (e) => {
      const card = e.target.closest(".agent-card");
      if (card) openDetail(card.dataset.id);
    });

    // Search
    let debounce;
    $("#search").addEventListener("input", (e) => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        searchQuery = e.target.value.trim();
        renderAgents();
      }, 150);
    });

    // Close detail
    $("#detail-close").addEventListener("click", closeDetail);
    $("#overlay").addEventListener("click", closeDetail);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeDetail();
      // Focus search on /
      if (e.key === "/" && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== "INPUT") {
        e.preventDefault();
        $("#search").focus();
      }
    });

    // Mobile toggle
    $("#mobile-toggle").addEventListener("click", () => {
      $("#sidebar").classList.toggle("mobile-open");
    });
  }
})();
</script>
</body>
</html>
